name: Runner Board nightly ingest

on:
  schedule:
    # 04:40 UTC = 11:40 PM CDT (summer) / 10:40 PM CST (winter). Adjust in November if the hour matters.
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Extract and print only; write nothing, move nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r ingest/requirements.txt
      - name: ffmpeg (for screen-recording inputs)
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Ingest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python ingest/ingest.py
      - name: Commit data
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "runner-board-bot"
          git config user.email "runner-board-bot@users.noreply.github.com"
          git add docs/data ledger
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "ingest: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
